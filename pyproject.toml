[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "workflow-v2-product"
version = "2.1.7"
description = "Workflow V2 Product: bounded, resumable, project-scoped execution"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
workflow = "scripts.workflow:main"
research-workflow = "scripts.workflow:main"
workflow-v2 = "scripts.research_workflow_cli:main"
workflow-v2-doctor = "scripts.product_doctor:main"
workflow-v2-mcp = "scripts.workflow_mcp:main"

[tool.setuptools]
packages = ["src", "scripts"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-p no:cacheprovider"

